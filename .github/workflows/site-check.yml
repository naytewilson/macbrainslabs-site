name: Verify public research site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  links-and-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify local navigation, canonicals, metadata and assets
        run: node scripts/check-site.mjs
      - name: Verify publication feed rules and record guards (network stubbed)
        run: |
          node scripts/test-publications-lkg.mjs
          node scripts/test-publications-ane-records.mjs
          node scripts/test-publications-diagnostic-records.mjs
          node scripts/test-publications-legacy-doi.mjs
      - name: Verify production-release gate against real HTTP bytes and a corrupted-image control
        run: node scripts/test-live-site-verifier.mjs
      - name: Recheck source-generated explorer, mobile media and share cards
        run: |
          node scripts/build-public-experience.mjs --check
          node scripts/check-mobile-media.mjs --check
          npm install --no-save --no-package-lock sharp@0.35.5
          node scripts/build-social-cards.mjs --check
          node scripts/check-site.mjs
