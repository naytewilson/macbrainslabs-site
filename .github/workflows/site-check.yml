name: Verify public research site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  links-and-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local navigation, canonicals, metadata and assets
        run: node scripts/check-site.mjs
