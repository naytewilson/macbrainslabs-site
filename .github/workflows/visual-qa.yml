name: Visual QA for public research site
on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - 'assets/**'
      - 'favicon.*'
      - 'site.webmanifest'
      - 'tests/visual/baselines/**'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-and-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install isolated browser QA runtime
        run: |
          npm install --global agent-browser@0.41.0
          agent-browser install --with-deps
      - name: Verify screenshots, responsive layout, navigation, accessibility and media
        run: node scripts/visual-qa.mjs
      - name: Preserve screenshots and diff evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macbrains-visual-qa-failure
          path: |
            tests/visual/current/
            tests/visual/diffs/
          if-no-files-found: ignore
          retention-days: 7
