name: Verify deployed MacBrains Labs website
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4,16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macbrains-public-pages-acceptance
  cancel-in-progress: true
jobs:
  published-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Wait for exact GitHub Pages deployment and verify every public asset, link and preview
        run: node scripts/verify-live-site.mjs --attempts=24 --delay-ms=12000
