name: Refresh publications feed
# A rebuilt feed is proposed as a pull request. This file does not push main.
# publications-feed-bot has no documented exception that would authorize a
# direct push. workflow_dispatch opens the same kind of pull request.
#
# GITHUB_TOKEN pull_request runs are created in an approval-required state.
# This job checks the candidate before pushing it and records that result on
# the candidate sha. It does not approve those runs and it does not merge.
on:
  schedule:
    - cron: '37 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  statuses: write
concurrency:
  group: publications-feed
  cancel-in-progress: false
jobs:
  recheck-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify publication last-known-good rules
        run: node scripts/test-publications-lkg.mjs
      - name: Verify reviewed research record (ane-record) guards and rendering
        run: node scripts/test-publications-ane-records.mjs
      - name: Verify diagnostic research record guards and rendering
        run: node scripts/test-publications-diagnostic-records.mjs
      - name: Verify package research record guards and rendering
        run: node scripts/test-publications-package-records.mjs
      - name: Verify the baseline DOI binding once a later record is cited
        run: node scripts/test-publications-legacy-doi.mjs
      - name: Verify the workflow opens a pull request and does not push main
        run: node scripts/test-publications-workflow.mjs
      - name: Verify publication pull request lifecycle against a scratch remote
        run: node scripts/test-publications-publish-pr.mjs
      - name: Re-derive upstream records and rebuild the feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-publications.mjs
      - name: Refresh public explorer from the last-known-good feed
        run: node scripts/build-public-experience.mjs
      - name: Rebuild page-specific social cards for published records
        run: |
          npm install --no-save --no-package-lock sharp@0.35.5
          node scripts/build-social-cards.mjs
      - name: Commit the candidate locally without pushing
        id: candidate
        run: node scripts/publish-publications-pr.mjs --commit-only
      - name: Verify the candidate with the site-check suite
        if: steps.candidate.outputs.has_diff == 'true'
        run: |
          node scripts/check-site.mjs
          node scripts/check-copy.mjs
          node scripts/test-publications-lkg.mjs
          node scripts/test-publications-ane-records.mjs
          node scripts/test-publications-diagnostic-records.mjs
          node scripts/test-publications-package-records.mjs
          node scripts/test-publications-legacy-doi.mjs
          node scripts/test-publications-workflow.mjs
          node scripts/test-publications-publish-pr.mjs
          node scripts/test-live-site-verifier.mjs
          node scripts/build-public-experience.mjs --check
          node scripts/check-mobile-media.mjs --check
          node scripts/build-social-cards.mjs --check
          node scripts/check-site.mjs
      - name: Push the candidate and open or update the pull request
        if: steps.candidate.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: node scripts/publish-publications-pr.mjs --push
      - name: Close a publication pull request that a fresh rebuild no longer supports
        if: steps.candidate.outputs.has_diff != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-publications-pr.mjs --no-diff
